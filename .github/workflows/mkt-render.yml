# Automated daily content — render the morning's batch.
#
# Draws the artwork for content that mkt-auto-generate wrote a little earlier,
# uploads it, and hands each slot back to be finalised.
#
# It is triggered by pg_cron calling GitHub's workflow_dispatch API, NOT by a
# schedule here — see the note on `on:` below for why. It must stay on the
# repository's default branch (niyom-main), which is the ref the dispatch asks
# for.
#
# The end-to-end monitor is the Auto Schedule screen in the CRM: a batch with
# nothing live renders red. `select * from mkt_auto_dispatch_status();` shows
# whether GitHub accepted the dispatch at all (204 = yes).
#
# The only credential here is MKT_RENDER_SECRET, which opens four verbs on
# mkt-auto-render-io and nothing else. There is deliberately no service-role key.

name: Render daily content

on:
  # No `schedule:` here, deliberately.
  #
  # GitHub does not dispatch scheduled events on time for this repository:
  # eight consecutive days measured 274-345 minutes of delay against a 03:20
  # UTC cron. The window this job has to hit is 65 minutes wide — generation
  # finishes at 02:55 UTC, the publish gate is 04:00 UTC (09:30 IST) — so a
  # five-hour queue can never land inside it, whatever the cron says. Leaving
  # the schedule in place produced three late, useless runs a day and three
  # failure emails with them.
  #
  # pg_cron keeps time reliably, so it now dispatches this workflow instead
  # (trigger_mkt_render_dispatch, migration 20261024100000). Dispatch events
  # are not subject to the schedule backlog.
  workflow_dispatch:
    inputs:
      run_date:
        description: 'IST run date (YYYY-MM-DD). Blank = today.'
        required: false
      dry_run:
        description: 'Render but upload nothing and finalise nothing'
        type: boolean
        default: false

# One render at a time. Overlapping runs would claim disjoint slots and work
# correctly, but serialising keeps the logs readable and the runner minutes low.
concurrency:
  group: mkt-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af   # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/mkt-render
        run: npm ci

      - name: Install brand fonts
        working-directory: tools/mkt-render
        # Fails the job if fontconfig cannot see them afterwards: textFit
        # measures glyph widths to choose line breaks, so a missing Inter
        # produces differently-wrapped posters rather than merely different
        # looking ones.
        run: node scripts/install-fonts.mjs

      - name: Install Chromium
        working-directory: tools/mkt-render
        run: npx playwright install --with-deps chromium

      - name: Build the render harness
        working-directory: tools/mkt-render
        run: npm run build:harness

      - name: Render
        working-directory: tools/mkt-render
        env:
          # Optional: the worker defaults to the production project URL, which is
          # not a secret and is hardcoded in the cron migrations too. Set this
          # variable only to point a run at a different project.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # Required. A repository SECRET, not a variable — they live on
          # different tabs and the distinction has already cost one failed run.
          MKT_RENDER_SECRET: ${{ secrets.MKT_RENDER_SECRET }}
          RUN_DATE: ${{ inputs.run_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx src/index.ts

      - name: Upload rendered assets
        # Always, so a failed run still leaves the partial artwork to look at —
        # which is usually the fastest way to see what went wrong.
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882   # v4.4.3
        with:
          name: rendered-${{ github.run_id }}
          path: tools/mkt-render/out
          if-no-files-found: ignore
          retention-days: 7
