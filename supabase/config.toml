[functions.public-partner-onboard-start]
verify_jwt = false

[functions.public-partner-onboard-verify]
verify_jwt = false

# A logged-in partner onboards their own client. verify_jwt=false but authenticates
# inside via the partner's bearer + nw_dsa (like place-partner-bond-order).
[functions.partner-onboard-client]
verify_jwt = false

# Device-PIN quick-login. *-pin-login are public (run before any session). The
# *-pin-set functions verify the caller's own bearer token inside so they can
# return spoken errors ("PIN too easy") instead of a bare 401. employee-pin-*
# additionally enforce role='employee' (admins keep password + 2FA).
[functions.partner-pin-set]
verify_jwt = false

[functions.partner-pin-login]
verify_jwt = false

[functions.employee-pin-set]
verify_jwt = false

[functions.employee-pin-login]
verify_jwt = false

# --- Marketing Tool / Content Creation -------------------------------------
# mkt-generate-content is intentionally absent from this file: it keeps the
# default verify_jwt = true and additionally re-checks admin role inside.

# Referral-link click tracking. Public because the visitor has no session yet.
# Stores no personal data: the IP is salted+hashed, writes are rate-limited per
# IP, and the response is always { ok: true } so it cannot be used to probe
# whether a referral code exists.
[functions.mkt-track-click]
verify_jwt = false

# Content expiry sweep, invoked by pg_cron via pg_net (which cannot present a
# JWT). Safe to leave open: the cron path only deletes content already past its
# expires_at — work the schedule would do minutes later regardless. The admin
# single-item delete path inside the same function requires an admin JWT of its
# own and is unaffected by this setting.
[functions.mkt-expire-content]
verify_jwt = false

# Automated daily content generation, invoked by pg_cron via pg_net (which
# cannot present a JWT). Unlike mkt-expire-content above, this one is NOT safe
# to leave open — it spends Anthropic tokens and creates content published under
# the firm's brand, so an open endpoint would be both a billing DoS and a
# content-injection vector. verify_jwt is off only so pg_net can reach it; the
# function itself requires either the MKT_AUTO_SECRET shared secret (compared in
# constant time) or a valid admin JWT, and refuses everything else.
[functions.mkt-auto-generate]
verify_jwt = false

# The render worker's only door into this project, called from a GitHub Actions
# runner (which has no Supabase session). verify_jwt is off so the runner can
# reach it; the function requires MKT_RENDER_SECRET, compared in constant time.
#
# That secret is DELIBERATELY different from MKT_AUTO_SECRET. It is the one
# credential that lives in GitHub, and it is scoped to rendering: a stolen copy
# lets someone re-render artwork for content that already exists, and nothing
# else — it cannot read a client record, cannot spend Anthropic tokens, and
# cannot write outside mkt_content_assets. Sharing one secret between the two
# functions, or handing the runner the service-role key, would give away all of
# that in exchange for one less secret to manage.
[functions.mkt-auto-render-io]
verify_jwt = false

# --- Partner Portal (DSA login) --------------------------------------------
# Resolves a partner's PAN to the email their auth user is registered under, so
# the browser can then call signInWithPassword. Public verify_jwt because it runs
# before any session exists — exactly like client-pan-login. Every failure path
# returns the same generic 401 so it cannot be used to probe which PANs belong
# to a partner, and it additionally throttles per-IP server-side (the login
# screen's own limiter is client-side only and trivially bypassed with curl).
[functions.partner-pan-login]
verify_jwt = false

# Partner refers a prospect from the portal. Public verify_jwt: runs with the
# partner's own bearer token and re-reads nw_dsa inside to confirm they are an
# enabled, active partner (metadata is never trusted), mirroring the shape of
# the public-onboard-* and raise-support-ticket functions.
[functions.partner-submit-lead]
verify_jwt = false

# Per-device 4-digit PIN sign-in. All three are public verify_jwt for the same
# reason as the other client-facing functions: -login runs before any session
# exists, and -set / -manage verify the caller's bearer token inside so they can
# answer with a spoken error ("that PIN is too easy to guess") rather than a
# bare 401. The lockout counting that makes a 4-digit secret defensible lives
# server-side in client-pin-login.
[functions.client-pin-set]
verify_jwt = false

[functions.client-pin-login]
verify_jwt = false

[functions.client-pin-manage]
verify_jwt = false

# create-partner-login is intentionally absent from this file: it keeps the
# default verify_jwt = true (an RM/admin calls it with their own bearer token)
# and additionally re-checks active-employee status and DSA ownership inside.

# --- Cashfree payment webhook ----------------------------------------------
# Public verify_jwt: the caller is Cashfree's server, which has no Supabase
# session and cannot be made to present one. Authentication is by HMAC instead —
# the function recomputes base64(HMAC-SHA256(secret, timestamp + rawBody)) over
# the exact received bytes and rejects any mismatch with a 401 before it touches
# the database, so the open JWT setting grants an unsigned caller nothing.
[functions.cashfree-payment-webhook]
verify_jwt = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# [experimental.pgdelta]
# When enabled, pg-delta becomes the active engine for supported schema flows.
# enabled = false
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
