# theirs, re-derives the partner price server-side (cost × per-bond margin, capped
# 5%), inserts the order (source='partner') routed to the client's RM, emails the RM.
[functions.place-partner-bond-order]
verify_jwt = false

# Public bond-offer landing (partner shared link). resolve-bond-share maps a share
# token to the bond at the partner's price (cost never included); submit-bond-offer
# turns a recipient's intent into a real order (if they match a client of the DSA)
# or a lead to the DSA's RM. Both fully public — no session exists on the link.
[functions.resolve-bond-share]
verify_jwt = false

[functions.submit-bond-offer]
verify_jwt = false

# Unlisted shares — the same four surfaces as bonds, priced per share rather than
# per ₹100 of face. Every one of them re-derives the price server-side from
# us_shares.latest_price × the approved markup; the base price is never accepted
# from, nor returned to, a caller.
[functions.place-share-order]
verify_jwt = false

[functions.place-partner-share-order]
verify_jwt = false

# Public share-offer landing (partner shared link). resolve-share-offer maps a
# token to the share at the partner's price (cost never included); submit-share-offer
# turns intent into a real order (if the contact matches a client of the DSA) or a
# lead to the DSA's RM. Both fully public — no session exists on the link.
[functions.resolve-share-offer]
verify_jwt = false

[functions.submit-share-offer]
verify_jwt = false

# Client "Forgot Password" — 6-digit OTP code flow (no magic link, which email
# scanners pre-consume). Both public because they run before any session exists;
# PAN-enumeration-safe, rate-limited, and code-hashed with a server pepper.
[functions.send-client-reset-otp]
verify_jwt = false

[functions.reset-client-password-with-otp]
verify_jwt = false

# Partner (DSA) self-serve reset — 6-digit OTP code flow (same rationale as the
