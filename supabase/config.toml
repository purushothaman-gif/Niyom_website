[functions.update-commodity-prices]
verify_jwt = false

# --- Conversion-first public onboarding. start/send-otp/verify-otp are fully
#     anonymous (no session yet). pan-verify/record-doc/submit run public but
#     require the client's own bearer token and verify record ownership inside
#     the function. ---
[functions.public-onboard-start]
verify_jwt = false

[functions.public-onboard-send-otp]
verify_jwt = false

[functions.public-onboard-verify-otp]
verify_jwt = false

[functions.public-pan-verify]
verify_jwt = false

# Anonymous PAN verify for the FIRST step of website self-signup (no account yet).
# Public verify_jwt: the visitor is unauthenticated; abuse is bounded by an
# internal already-registered short-circuit + a per-IP throttle inside the fn.
[functions.public-onboard-pan-verify]
verify_jwt = false

# --- "Become a partner" enquiry from the mobile app. Public verify_jwt: the
#     person has no Niyom account by definition, so there is no token to check.
#     A partner login cannot be self-created (an RM provisions it after an
#     agreement), so the function only records the interest as a lead in the
#     ADMIN POOL. Abuse is bounded in-function by a mobile-already-present
#     short-circuit plus a global hourly cap on rows this endpoint may add. ---
[functions.public-partner-enquiry]
verify_jwt = false

[functions.public-onboard-record-doc]
verify_jwt = false

[functions.public-onboard-submit]
verify_jwt = false

# Post-onboarding product activation (Bonds / Unlisted Shares). Public verify_jwt:
# runs with the client's own bearer token and verifies ownership + is_client
# inside the function, mirroring the other public-onboard-* functions.
[functions.public-request-product-activation]
verify_jwt = false

# Client-portal "Raise a Ticket". Public verify_jwt: runs with the client's own
# bearer token and verifies ownership + is_client inside the function; inserts
# the ticket (fires the RM in-app alert trigger) and emails the assigned RM.
[functions.raise-support-ticket]
verify_jwt = false

# Client-portal bond ordering. Public verify_jwt: runs with the client's own
# bearer token and verifies ownership + is_client inside the function; re-derives
# the price server-side (approved markup only) and inserts the order (fires the RM
# in-app alert trigger), then emails the assigned RM.
[functions.place-bond-order]
verify_jwt = false

# Partner-portal bond ordering on behalf of a client. Public verify_jwt: runs with
